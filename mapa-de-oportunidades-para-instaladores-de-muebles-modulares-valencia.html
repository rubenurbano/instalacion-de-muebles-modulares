    <style>
        /* Estilos personalizados para barra de desplazamiento y experiencia táctil fluida en móviles como Samsung Galaxy A02s */
        body {
            background-color: #040914;
            color: #f1f5f9;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ocultar scrollbar en la barra de pestañas manteniendo el desplazamiento táctil horizontal */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Efecto Glassmorphism de Agencia Digital */
        .glass-header {
            background: rgba(4, 9, 20, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 229, 255, 0.15);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(15, 33, 66, 0.55) 0%, rgba(8, 18, 38, 0.85) 100%);
            border: 1px solid rgba(56, 189, 248, 0.16);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
        }

        .glass-card-highlight {
            background: linear-gradient(145deg, rgba(16, 42, 84, 0.7) 0%, rgba(11, 24, 52, 0.92) 100%);
            border: 1px solid rgba(0, 229, 255, 0.35);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.1);
        }

        /* Botones flotantes arrastrables */
        .floating-draggable {
            touch-action: none;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .floating-draggable:active {
            transform: scale(0.95);
        }

        /* Animación de entrada suave entre pestañas */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .tab-panel-active {
            animation: fadeSlideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Gradientes de texto */
        .text-gradient-cyan {
            background: linear-gradient(90deg, #38bdf8 0%, #00e5ff 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>

        let currentTabIndex = 0;

        /**

            const verticalList = document.getElementById('index-vertical-list');

                <button id="top-tab-${index}" onclick="switchTab(${index})"

                    }">
                    ${tab.tabName}
                </button>
            `).join('');

            verticalList.innerHTML = TABS_DATA.map((tab, index) => `
                <button onclick="switchTab(${index}); toggleIndexModal(false);"
                    class="w-full p-3 rounded-xl text-left flex items-center justify-between gap-3 transition-all border ${
                        index === currentTabIndex
                        ? 'bg-cyan-500/20 border-cyan-400/50 text-white'
                        : 'bg-slate-950/60 border-slate-800/80 text-slate-300 hover:bg-slate-800/80'
                    }">
                    <div>
                        <span class="block text-xs sm:text-sm font-bold ${index === currentTabIndex ? 'text-cyan-300' : 'text-white'}">${tab.tabName}</span>
                        <span class="block text-[11px] text-slate-400 mt-0.5">${tab.subtitle}</span>
                    </div>
                    <svg class="w-4 h-4 shrink-0 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">

        /**
         * Cambia a la pestaña seleccionada, auto-centra el botón en la barra superior
         * y actualiza los botones de navegación inferior (Anterior / Próxima).
         */
        function switchTab(index) {
            if (index < 0 || index >= TABS_DATA.length) return;
            currentTabIndex = index;

            const container = document.getElementById('tab-content-container');
            container.innerHTML = `<div class="tab-panel-active">${TABS_DATA[index].content}</div>`;

            // Actualizar estilos de pestañas e índice
            initNavigation();

            // Auto-centrado horizontal suave en la pestaña activa
            const activeTabBtn = document.getElementById(`top-tab-${index}`);
            if (activeTabBtn) {
                activeTabBtn.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'center'
                });
            }

            // Renderizar botones fijos al final de cada pestaña (Anterior / Próxima)
            renderBottomNavButtons(index);

            // Desplazar suavemente al comienzo de la pestaña actual
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /**
         * Genera los botones fijos al final de cada pestaña para ir a la anterior (si existe) y a la próxima
         */
        function renderBottomNavButtons(index) {
            const bottomNav = document.getElementById('bottom-tab-navigation');
            const prevTab = index > 0 ? TABS_DATA[index - 1] : null;
            const nextTab = index < TABS_DATA.length - 1 ? TABS_DATA[index + 1] : null;

            let html = '';

            if (prevTab) {
                html += `
                    <button onclick="switchTab(${index - 1})"
                        class="flex-1 sm:flex-initial flex items-center justify-center sm:justify-start gap-2.5 px-4 py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 text-xs sm:text-sm font-semibold transition-all active:scale-95">

                            <span class="block text-white font-bold">${prevTab.tabName}</span>
                        </div>
                    </button>
                `;
            } else {
                html += `<div></div>`;
            }

            if (nextTab) {
                html += `

                        class="flex-1 sm:flex-initial flex items-center justify-center sm:justify-end gap-2.5 px-4 py-3.5 rounded-2xl bg-gradient-to-r from-blue-600/30 to-cyan-500/30 hover:from-blue-600/45 hover:to-cyan-500/45 border border-cyan-400/50 text-white text-xs sm:text-sm font-semibold transition-all active:scale-95 shadow-lg">

                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                        </svg>

                `;

            bottomNav.innerHTML = html;

        /**
         * Control del Modal de Índice (Menú Sándwich)
         */
        function toggleIndexModal(show) {
            const modal = document.getElementById('index-modal');
            if (show) {
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } else {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }
        }

        /**
         * Control individual y masivo de Preguntas y Respuestas
         * Default: Plegadas
         */
        function toggleSingleQA(idx) {
            const answerEl = document.getElementById(`qa-answer-${idx}`);
            const iconEl = document.getElementById(`qa-icon-${idx}`);
            if (!answerEl || !iconEl) return;

            const isHidden = answerEl.classList.contains('hidden');
            if (isHidden) {
                answerEl.classList.remove('hidden');
                iconEl.textContent = '−';
            } else {
                answerEl.classList.add('hidden');
                iconEl.textContent = '+';
            }
        }

        function toggleAllQA(expand) {
            for (let i = 0; i < 6; i++) {
                const answerEl = document.getElementById(`qa-answer-${i}`);
                const iconEl = document.getElementById(`qa-icon-${i}`);
                if (answerEl && iconEl) {
                    if (expand) {
                        answerEl.classList.remove('hidden');
                        iconEl.textContent = '−';
                    } else {
                        answerEl.classList.add('hidden');
                        iconEl.textContent = '+';
                    }
                }
            }
        }

        /**
         * Sistema de arrastre táctil y con ratón para los botones flotantes (INICIO y ARRIBA)
         * Distingue perfectamente entre arrastrar el botón y tocarlo para ejecutar su acción.
         */
        function makeButtonDraggable(btnElement, onTapCallback) {
            let isDragging = false;
            let hasMoved = false;
            let startX, startY, initialLeft, initialTop;

            function onPointerDown(e) {
                isDragging = true;
                hasMoved = false;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const rect = btnElement.getBoundingClientRect();

                startX = clientX;
                startY = clientY;
                initialLeft = rect.left;
                initialTop = rect.top;

                btnElement.style.right = 'auto';
                btnElement.style.bottom = 'auto';
                btnElement.style.left = `${initialLeft}px`;
                btnElement.style.top = `${initialTop}px`;
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - startX;
                const dy = clientY - startY;

                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    hasMoved = true;
                }

                if (hasMoved) {
                    e.preventDefault();
                    const rect = btnElement.getBoundingClientRect();
                    const maxLeft = window.innerWidth - rect.width - 8;
                    const maxTop = window.innerHeight - rect.height - 8;

                    const newLeft = Math.min(Math.max(8, initialLeft + dx), maxLeft);
                    const newTop = Math.min(Math.max(96, initialTop + dy), maxTop);

                    btnElement.style.left = `${newLeft}px`;
                    btnElement.style.top = `${newTop}px`;
                }
            }

            function onPointerUp() {
                if (!isDragging) return;
                isDragging = false;
                if (!hasMoved && typeof onTapCallback === 'function') {
                    onTapCallback();
                }
            }

            btnElement.addEventListener('mousedown', onPointerDown);
            window.addEventListener('mousemove', onPointerMove, { passive: false });
            window.addEventListener('mouseup', onPointerUp);

            btnElement.addEventListener('touchstart', onPointerDown, { passive: true });
            window.addEventListener('touchmove', onPointerMove, { passive: false });
            window.addEventListener('touchend', onPointerUp);
        }

        // Inicialización al cargar el DOM
        document.addEventListener('DOMContentLoaded', () => {
            switchTab(0);

            // Configurar botón flotante movible INICIO
            const floatHome = document.getElementById('float-btn-home');
            makeButtonDraggable(floatHome, () => {
                switchTab(0);
            });

            // Configurar botón flotante movible ARRIBA (comienzo de la pestaña actual)
            const floatTop = document.getElementById('float-btn-top');
            makeButtonDraggable(floatTop, () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
