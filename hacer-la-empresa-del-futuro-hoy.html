  <style>

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #07090e;
      color: #f8fafc;
      overscroll-behavior-y: none;
    }
    .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Barras de desplazamiento sutiles */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #07090e;
    }
    ::-webkit-scrollbar-thumb {
      background: #24304c;
      border-radius: 9999px;
    }
    /* Botones flotantes arrastrables sin retraso táctil */
    .draggable-fab {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      will-change: left, top;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.14);
      transition: transform 0.12s ease, background-color 0.2s ease;
    }
    .draggable-fab:active {
      transform: scale(0.93);
    }
    /* Animación ligera para cambio de pestañas */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .tab-animate {
      animation: fadeSlideUp 0.22s ease-out forwards;

               onclick="window.open('${url}', '_blank', 'noopener,noreferrer'); return false;"

    // Estado de la pestaña activa

    // Referencias del DOM

    const headerStepCounter = document.getElementById('headerStepCounter');

    /**
     * Desplaza suavemente al comienzo de la pestaña actual (Funciona en todas las pestañas)

    function scrollToCurrentTabTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }

    /**
     * Cambia a la pestaña indicada por su índice (0 a 16)
     */
    function goToTab(index) {
      if (index < 0 || index >= tutorialTabs.length) return;
      currentTabIndex = index;
      const tab = tutorialTabs[currentTabIndex];

      // Actualizar contadores e indicadores superiores
      const stepNum = currentTabIndex + 1;
      const totalSteps = tutorialTabs.length;
      headerStepCounter.textContent = `PESTAÑA ${stepNum} DE ${totalSteps}`;
      headerStepTitle.textContent = tab.shortMenuTitle;
      footerFraction.textContent = `${stepNum}/${totalSteps}`;
      progressBar.style.width = `${(stepNum / totalSteps) * 100}%`;

      // Si no es la pestaña INICIO, mostramos una cabecera limpia de sección (sin "by Rubén Sbarsky")
      let sectionHeaderHtml = '';
      if (currentTabIndex > 0) {
        sectionHeaderHtml = `
          <div class="mb-5 pb-4 border-b border-slate-800">
            <span class="inline-block text-[11px] font-display font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-md bg-brand-500/15 text-brand-400 border border-brand-500/30 mb-2">
              ${tab.badge}
            </span>
            <h1 class="font-display font-extrabold text-xl sm:text-3xl text-white leading-tight">

            </h1>

              ${tab.subtitle}
            </p>
          </div>
        `;
      }

      // Renderizar el contenido de la pestaña con animación suave
      tabContentArea.classList.remove('tab-animate');
      void tabContentArea.offsetWidth; // reflow
      tabContentArea.classList.add('tab-animate');
      tabContentArea.innerHTML = sectionHeaderHtml + tab.contentHtml;

      // Si estamos en INICIO, poblar la cuadrícula interactiva de capítulos
      if (currentTabIndex === 0) {
        const homeGrid = document.getElementById('homeGridIndex');
        if (homeGrid) {
          homeGrid.innerHTML = tutorialTabs.slice(1).map((item, idx) => {
            const targetIdx = idx + 1;
            return `
              <button type="button" onclick="goToTab(${targetIdx})"
                class="text-left p-3.5 rounded-2xl bg-surface-900 hover:bg-surface-800 border border-slate-800 hover:border-brand-500/50 transition flex items-start justify-between gap-2.5 group active:scale-98">
                <div class="min-w-0">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-brand-400 block">${item.badge}</span>
                  <h3 class="font-display font-bold text-xs sm:text-sm text-white group-hover:text-amber-300 transition truncate mt-0.5">${item.shortMenuTitle}</h3>
                  <p class="text-[11px] text-slate-400 line-clamp-2 mt-1">${item.subtitle}</p>
                </div>
                <span class="p-1.5 rounded-lg bg-surface-950 text-slate-400 group-hover:text-brand-400 shrink-0 mt-1">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>

      // Configurar botones Anterior y Próxima al final del contenido y en la barra fija inferior
      const hasPrev = currentTabIndex > 0;

      const nextTab = hasNext ? tutorialTabs[currentTabIndex + 1] : null;

      // 1. Actualizar botones de la barra fija inferior
      if (hasPrev) {
        fixedPrevBtn.classList.remove('hidden');

      // 2. Actualizar bloque de navegación al final de cada pestaña
      inPageBottomNav.innerHTML = `

          ${hasNext ? `
            <button type="button" onclick="goToTab(${currentTabIndex + 1})"

              <div class="min-w-0">
                <span class="text-[10px] font-bold uppercase tracking-wider text-brand-400 block">PRÓXIMA PESTAÑA</span>
                <span class="font-display font-bold text-xs sm:text-sm text-white truncate block">${nextTab.shortMenuTitle}</span>
              </div>
              <div class="p-2 rounded-xl bg-brand-500 text-slate-950 shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                </svg>

            </button>
          ` : `
            <button type="button" onclick="goToTab(0)"
              class="flex-1 p-3.5 rounded-2xl bg-emerald-500/20 border border-emerald-400/50 text-center transition active:scale-98 flex items-center justify-center gap-2">

      // Actualizar estado activo en el menú sándwich

    /**
     * Renderiza la lista de pestañas dentro del Menú Sándwich (Índice)
     */
    function renderDrawerList(filterQuery = '') {
      const normalized = filterQuery.trim().toLowerCase();
      drawerNavList.innerHTML = tutorialTabs.map((item, idx) => {
        const matches = !normalized ||
          item.shortMenuTitle.toLowerCase().includes(normalized) ||
          item.subtitle.toLowerCase().includes(normalized) ||
          item.badge.toLowerCase().includes(normalized);

        if (!matches) return '';

        const isActive = idx === currentTabIndex;
        return `
          <button type="button" onclick="selectTabFromDrawer(${idx})"
            class="w-full text-left p-2.5 rounded-xl transition flex items-center justify-between gap-2 ${
              isActive
                ? 'bg-brand-500 text-slate-950 font-bold shadow-sm'
                : 'text-slate-200 hover:bg-surface-800'
            }">
            <div class="min-w-0">
              <span class="text-[10px] uppercase tracking-wider block ${isActive ? 'text-slate-900 font-extrabold' : 'text-brand-400 font-semibold'}">
                ${item.badge}
              </span>
              <span class="text-xs sm:text-sm truncate block ${isActive ? 'font-extrabold' : 'font-medium'}">
                ${item.shortMenuTitle}
              </span>
            </div>
            ${isActive ? `
              <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded bg-slate-950 text-brand-400 shrink-0">Activa</span>
            ` : `
              <svg class="w-4 h-4 text-slate-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>

            `}

      }).join('');
    }

    function openDrawer() {
      drawerBackdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        drawerBackdrop.classList.remove('opacity-0');
        drawerPanel.classList.remove('-translate-x-full');
      });
    }

    function closeDrawer() {
      drawerBackdrop.classList.add('opacity-0');
      drawerPanel.classList.add('-translate-x-full');
      setTimeout(() => {
        drawerBackdrop.classList.add('hidden');
      }, 220);
    }

    window.selectTabFromDrawer = function(idx) {
      closeDrawer();
      goToTab(idx);
    };

    // Eventos del Menú Sándwich y barra fija inferior
    document.getElementById('openDrawerBtn').addEventListener('click', openDrawer);
    document.getElementById('footerIndexBtn').addEventListener('click', openDrawer);
    document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);

    indexSearchInput.addEventListener('input', (e) => {
      renderDrawerList(e.target.value);
    });

    fixedPrevBtn.addEventListener('click', () => {
      if (currentTabIndex > 0) goToTab(currentTabIndex - 1);
    });

    fixedNextBtn.addEventListener('click', () => {
      if (currentTabIndex < tutorialTabs.length - 1) goToTab(currentTabIndex + 1);
    });

    /**
     * Sistema de Botones Flotantes Movibles (Touch + Mouse)
     * Distingue entre arrastrar el botón por la pantalla y tocarlo (click/tap) para ejecutar su acción.
     */
    function makeFloatingButtonDraggable(buttonEl, onTapCallback) {
      let isDragging = false;
      let hasMoved = false;
      let startX = 0;
      let startY = 0;
      let initialLeft = 0;
      let initialTop = 0;

      function onPointerStart(clientX, clientY) {
        isDragging = true;
        hasMoved = false;
        startX = clientX;
        startY = clientY;
        const rect = buttonEl.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
        // Convertir posicionamiento a left/top para arrastre fluido
        buttonEl.style.left = `${initialLeft}px`;
        buttonEl.style.top = `${initialTop}px`;
        buttonEl.style.right = 'auto';
        buttonEl.style.bottom = 'auto';
      }

      function onPointerMove(clientX, clientY) {
        if (!isDragging) return;
        const dx = clientX - startX;
        const dy = clientY - startY;

        if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
          hasMoved = true;
        }

        if (hasMoved) {
          const rect = buttonEl.getBoundingClientRect();
          const maxLeft = window.innerWidth - rect.width - 6;
          const maxTop = window.innerHeight - rect.height - 6;
          const newLeft = Math.max(6, Math.min(maxLeft, initialLeft + dx));
          const newTop = Math.max(6, Math.min(maxTop, initialTop + dy));
          buttonEl.style.left = `${newLeft}px`;
          buttonEl.style.top = `${newTop}px`;
        }
      }

      function onPointerEnd() {
        if (!isDragging) return;
        isDragging = false;
        if (!hasMoved) {
          onTapCallback();
        }
      }

      // Eventos Táctiles (Samsung Galaxy A02s)
      buttonEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          onPointerStart(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      window.addEventListener('touchend', () => {
        onPointerEnd();
      });

      // Eventos de Ratón (Escritorio)
      buttonEl.addEventListener('mousedown', (e) => {
        e.preventDefault();
        onPointerStart(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        onPointerMove(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', () => {
        onPointerEnd();
      });
    }

    // Inicializar los dos botones flotantes movibles requeridos:
    // 1. Botón flotante movible que lleva de cualquier lugar a INICIO
    const fabHome = document.getElementById('fabHome');
    makeFloatingButtonDraggable(fabHome, () => {
      goToTab(0);
    });

    // 2. Botón flotante movible ARRIBA que lleva siempre al comienzo de la pestaña actual
    const fabTop = document.getElementById('fabTop');
    makeFloatingButtonDraggable(fabTop, () => {
      scrollToCurrentTabTop();
    });

    // Mantener los botones flotantes dentro del área visible si gira la pantalla del móvil
    window.addEventListener('resize', () => {
      [fabHome, fabTop].forEach((btn) => {
        if (btn.style.left && btn.style.top) {
          const rect = btn.getBoundingClientRect();
          const maxLeft = Math.max(6, window.innerWidth - rect.width - 6);
          const maxTop = Math.max(6, window.innerHeight - rect.height - 6);
          if (rect.left > maxLeft) btn.style.left = `${maxLeft}px`;
          if (rect.top > maxTop) btn.style.top = `${maxTop}px`;
        }
      });
    });

    // Inicializar el tutorial en la pestaña INICIO al cargar
    window.addEventListener('DOMContentLoaded', () => {
      goToTab(0);
    });
  </script>
