<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>NOVA LLAR - Directorio de Canales y Contactos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-dark: #111622;
      --border-dark: #1e2738;
      --accent: #f59e0b;
      --accent-light: #fbbf24;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: #f1f5f9;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .glass-bar {
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .card-premium {
      background: linear-gradient(145deg, #121826 0%, #0d121d 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card-premium:active {
      transform: scale(0.99);
    }
    .tab-btn-active {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #050811 !important;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      border-color: transparent !important;
    }
    .draggable-fab {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 90;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7), 0 0 0 2px rgba(245, 158, 11, 0.4);
    }
    .draggable-fab:active {
      transform: scale(1.08);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-tab {
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

  <!-- HEADER Y BARRA DE PESTAÑAS PERMANENTE -->
  <header class="fixed top-0 left-0 right-0 z-50 glass-bar border-b border-slate-800/80 shadow-2xl">
    <!-- Top Brand & Botón Índice Sándwich -->
    <div class="flex items-center justify-between px-3 py-2.5 max-w-4xl mx-auto">
      <div class="flex items-center gap-2.5">
        <button id="menuToggleBtn" onclick="toggleDrawer(true)" aria-label="Abrir Índice" class="flex items-center gap-2 bg-slate-800/90 hover:bg-slate-700 active:bg-amber-500 active:text-black text-amber-400 font-bold px-3 py-2 rounded-xl border border-slate-700/80 shadow-md transition-all text-xs tracking-wider uppercase">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <span>ÍNDICE</span>
        </button>
        <div onclick="switchTab('inicio')" class="cursor-pointer">
          <span class="text-xs font-extrabold tracking-widest text-amber-500 block leading-none">VALENCIA + 50 KM</span>
          <span class="text-sm font-black tracking-tight text-white">NOVA LLAR</span>
        </div>
      </div>

      <!-- Indicador de progreso de pestañas -->
      <div class="flex items-center gap-2">
        <span id="tabCounter" class="text-[11px] font-bold bg-slate-900/90 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-800">1 / 12</span>
      </div>
    </div>

    <!-- Barra de Pestañas con Desplazamiento Táctil Horizontal y Auto-centrado -->
    <nav id="topTabBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar px-3 py-2 border-t border-slate-800/60 max-w-4xl mx-auto scroll-smooth">
      <!-- Renderizado dinámico por JS -->
    </nav>
  </header>

  <!-- CAJÓN LATERAL / MODAL DE ÍNDICE (MENÚ SÁNDWICH) -->
  <div id="drawerOverlay" onclick="toggleDrawer(false)" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-200"></div>
  <aside id="drawerMenu" class="fixed top-0 left-0 bottom-0 w-[85%] max-w-sm bg-[#0c101a] border-r border-slate-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">

      <div>

        <h2 class="text-base font-extrabold text-white">Índice del Directorio</h2>
      </div>
      <button onclick="toggleDrawer(false)" class="p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white active:bg-rose-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <div id="drawerList" class="flex-1 overflow-y-auto p-3 space-y-1.5">
      <!-- Renderizado dinámico por JS -->
    </div>
    <div class="p-3 border-t border-slate-800 bg-slate-950/80 text-center">
      <p class="text-[11px] text-slate-400 font-medium">NOVA LLAR • Rubén Sbarsky • 11/11/2026</p>
    </div>
  </aside>

  <!-- CONTENIDO PRINCIPAL (ESPACIO PARA HEADER SUPERIOR Y BARRA INFERIOR) -->

    <!-- Las secciones se inyectan y muestran aquí -->
  </main>

  <!-- BARRA INFERIOR FIJA: BOTONES ANTERIOR Y PRÓXIMA PESTAÑA -->

    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2.5">
      <button id="prevTabBtn" onclick="navigateRelative(-1)" class="flex-1 flex items-center justify-center gap-2 py-3 px-3 rounded-xl font-bold text-xs bg-slate-800/90 text-slate-200 border border-slate-700 active:bg-amber-500 active:text-black transition-all disabled:opacity-30 disabled:pointer-events-none">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
        </svg>

      </button>

      const cleanUrl = url.startsWith('http') ? url : 'https://' + url;
      return `
        <div class="mt-2.5 p-2.5 rounded-xl bg-slate-950/90 border border-slate-800/90 flex flex-col gap-2">
          <div class="flex items-start justify-between gap-2">
            <div class="text-xs text-slate-300 break-all leading-snug">
              <span class="font-semibold text-amber-400 block mb-0.5">${labelText}</span>
              ${sourceNote ? `<span class="text-slate-400 text-[11px] block mb-1">${sourceNote}</span>` : ''}
              <span class="text-[11px] text-slate-400 font-mono">${url}</span>
            </div>
          </div>
          <a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" 
             class="w-full py-2 px-3 rounded-lg bg-amber-500/15 hover:bg-amber-500/25 active:bg-amber-500 active:text-slate-950 text-amber-300 border border-amber-500/40 font-bold text-xs flex items-center justify-center gap-1.5 transition-all shadow-sm">
            <span>Abrir en otra Ventana</span>
            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
            </svg>

        </div>
      `;
    }

    // Función para renderizar cada ficha de empresa manteniendo el 100% de los datos y botones "Abrir en otra Ventana"
    function renderCompanyCard(item) {
      let phonesHtml = '';
      if (item.phones && item.phones.length > 0) {
        phonesHtml = item.phones.map(p => {
          const cleanTel = p.num.replace(/\s+/g, '');
          return `
            <div class="mt-2.5 pt-2.5 border-t border-slate-800/80">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="text-xs text-slate-300">
                  <span class="text-slate-400">Teléfono:</span> 
                  <strong class="text-white text-sm ml-1">${p.num}</strong>
                </div>
                <a href="tel:${cleanTel}" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-bold text-xs flex items-center gap-1 active:bg-emerald-500 active:text-slate-950">
                  <span>📞 Llamar</span>
                </a>
              </div>
              ${renderUrlAction(p.url, `Fuente del teléfono (${p.sourceText})`)}

      } else if (item.noPhoneText) {
        phonesHtml = `
          <div class="mt-2.5 pt-2.5 border-t border-slate-800/80 text-xs text-amber-300">
            <span class="font-bold">Teléfono:</span> ${item.noPhoneText}

        `;
      }

      let emailHtml = '';
      if (item.email) {
        emailHtml = `
          <div class="mt-2 text-xs text-slate-300 flex items-center justify-between bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
            <div class="truncate"><span class="text-slate-400">Email:</span> <strong class="text-white">${item.email}</strong></div>
            <a href="mailto:${item.email}" target="_blank" rel="noopener noreferrer" class="ml-2 px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold text-[11px] shrink-0">

          <p class="text-xs text-slate-300 mt-1.5 leading-relaxed">

    let currentTabIndex = 0;

    function initNavigation() {
      const topTabBar = document.getElementById('topTabBar');
      const drawerList = document.getElementById('drawerList');

      topTabBar.innerHTML = TABS_DATA.map((tab, idx) => `
        <button id="topTab-${tab.id}" onclick="switchTab('${tab.id}')" 
                class="shrink-0 flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-800 bg-slate-900/90 text-slate-300 transition-all">
          <span>${tab.icon}</span>
          <span class="whitespace-nowrap">${tab.shortTitle}</span>
        </button>
      `).join('');

      drawerList.innerHTML = TABS_DATA.map((tab, idx) => `
        <button id="drawerTab-${tab.id}" onclick="switchTab('${tab.id}'); toggleDrawer(false);" 
                class="w-full flex items-center justify-between p-3 rounded-xl text-left border border-slate-800/80 bg-slate-900/60 hover:bg-slate-800 text-slate-200 transition-all">
          <div class="flex items-center gap-3 min-w-0">
            <span class="text-lg shrink-0">${tab.icon}</span>
            <div class="truncate">
              <div class="text-xs font-bold truncate">${tab.shortTitle}</div>
              <div class="text-[10px] text-slate-400 truncate">${tab.badge}</div>
            </div>
          </div>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400 ml-2">${idx + 1}</span>
        </button>
      `).join('');
    }

    function switchTab(tabId) {
      const idx = TABS_DATA.findIndex(t => t.id === tabId);
      if (idx === -1) return;
      currentTabIndex = idx;
      const currentTab = TABS_DATA[idx];

      // Inyectar contenido
      const mainContent = document.getElementById('mainContent');
      mainContent.innerHTML = currentTab.render();

      // Actualizar contador
      document.getElementById('tabCounter').textContent = `${idx + 1} / ${TABS_DATA.length}`;

      // Actualizar estado visual de las pestañas superiores y auto-centrar la pestaña activa
      TABS_DATA.forEach((t) => {
        const btn = document.getElementById(`topTab-${t.id}`);
        const dBtn = document.getElementById(`drawerTab-${t.id}`);
        if (t.id === tabId) {
          btn.classList.add('tab-btn-active');
          dBtn.classList.add('border-amber-500', 'bg-amber-500/15', 'text-amber-300');
          // Auto-centrado suave en la barra horizontal
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        } else {
          btn.classList.remove('tab-btn-active');
          dBtn.classList.remove('border-amber-500', 'bg-amber-500/15', 'text-amber-300');
        }
      });

      // Actualizar botones fijo inferior (Anterior / Siguiente)
      const prevBtn = document.getElementById('prevTabBtn');
      const nextBtn = document.getElementById('nextTabBtn');
      const prevLabel = document.getElementById('prevTabLabel');
      const nextLabel = document.getElementById('nextTabLabel');

      if (idx > 0) {
        prevBtn.disabled = false;
        prevLabel.textContent = TABS_DATA[idx - 1].shortTitle;
      } else {
        prevBtn.disabled = true;
        prevLabel.textContent = 'Inicio';
      }

      if (idx < TABS_DATA.length - 1) {
        nextBtn.disabled = false;
        nextLabel.textContent = TABS_DATA[idx + 1].shortTitle;
      } else {
        nextBtn.disabled = true;
        nextLabel.textContent = 'Fin';
      }

      // Subir al comienzo de la pestaña recién abierta
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateRelative(delta) {
      const nextIdx = currentTabIndex + delta;
      if (nextIdx >= 0 && nextIdx < TABS_DATA.length) {
        switchTab(TABS_DATA[nextIdx].id);
      }
    }

    function scrollToCurrentTabTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleDrawer(open) {
      const overlay = document.getElementById('drawerOverlay');
      const drawer = document.getElementById('drawerMenu');
      if (open) {
        overlay.classList.remove('hidden');
        setTimeout(() => overlay.classList.remove('opacity-0'), 10);
        drawer.classList.remove('-translate-x-full');
      } else {
        overlay.classList.add('opacity-0');
        drawer.classList.add('-translate-x-full');
        setTimeout(() => overlay.classList.add('hidden'), 250);
      }
    }

    // Hacer que los botones flotantes (INICIO y ARRIBA) sean 100% movibles / arrastrables en pantalla táctil y ratón
    function makeFabDraggable(el, onClickCallback) {
      let isDragging = false;
      let hasMoved = false;
      let startX = 0, startY = 0;
      let initialLeft = 0, initialTop = 0;

      el.addEventListener('pointerdown', (e) => {
        isDragging = true;
        hasMoved = false;
        startX = e.clientX;
        startY = e.clientY;
        const rect = el.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        el.style.right = 'auto';
        el.style.bottom = 'auto';
        el.style.left = `${initialLeft}px`;
        el.style.top = `${initialTop}px`;
        el.setPointerCapture(e.pointerId);
      });

      el.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
          hasMoved = true;
        }
        if (hasMoved) {
          const maxX = window.innerWidth - el.offsetWidth - 6;
          const maxY = window.innerHeight - el.offsetHeight - 6;
          const newX = Math.max(6, Math.min(maxX, initialLeft + dx));
          const newY = Math.max(6, Math.min(maxY, initialTop + dy));
          el.style.left = `${newX}px`;
          el.style.top = `${newY}px`;
        }
      });

      el.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        el.releasePointerCapture(e.pointerId);
        if (!hasMoved) {
          onClickCallback();
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      initNavigation();
      switchTab('inicio');

      makeFabDraggable(document.getElementById('fabInicio'), () => {
        switchTab('inicio');
      });

      makeFabDraggable(document.getElementById('fabArriba'), () => {
        scrollToCurrentTabTop();
      });
    });
  </script>
