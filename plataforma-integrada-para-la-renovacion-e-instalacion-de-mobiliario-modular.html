                        <div class="agency-card rounded-2xl p-4 sm:p-5 space-y-3.5">
                            <p>Este proyecto no nace con la intención de crear otra empresa convencional de montaje de muebles.</p>
                            <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Nace de una pregunta distinta:</p>
                            <blockquote class="p-4 rounded-xl bg-gradient-to-r from-amber-500/20 to-cyan-500/15 border-l-4 border-amber-400 font-display font-bold text-white text-base sm:text-lg">
                                ¿Por qué el consumidor tiene que organizar por separado la compra, la financiación, el transporte, la retirada y la instalación cuando todos esos elementos forman parte de una misma necesidad?
                            </blockquote>
                            <p>La propuesta es construir una empresa que reúna esas piezas en una solución completa, con una relación directa con el cliente, una experiencia digital moderna, inteligencia artificial aplicada a procesos concretos, proveedores existentes, profesionales de instalación y financiación ofrecida por una entidad especializada.</p>
                            <p>La entrada al mercado se realizará mediante un servicio claro y reconocible: la renovación integral de cocinas modulares. A partir de la experiencia, los procesos y la confianza obtenidos, podrá estudiarse la ampliación hacia otras categorías de mobiliario y una red más amplia de profesionales.</p>
                            <p>La innovación no depende de inventar cada componente. Depende de combinar tecnologías, productos, servicios y capacidades que ya existen para ofrecer al consumidor una experiencia que hoy suele estar repartida entre distintos actores.</p>
                        </div>

                        <div class="p-5 rounded-2xl bg-gradient-to-br from-amber-500/25 via-slate-900 to-cyan-500/25 border border-amber-400/50 text-center space-y-2">
                            <p class="font-display font-extrabold text-base sm:text-xl text-white">
                                No se trata solamente de montar muebles. Se trata de organizar de otra manera el negocio de equipar e instalar el hogar.
                            </p>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-900/90 border border-white/10 text-xs text-slate-400 italic leading-relaxed">
                            Documento conceptual. Las descripciones de evolución, automatización, acuerdos comerciales y colaboración financiera representan objetivos o hipótesis de desarrollo y deberán validarse antes de considerarse capacidades implantadas o acuerdos existentes.
                        </div>
                    </div>
                `
            }
        ];

        let currentTabIndex = 0;

        // Render Visible Horizontal Tab Bar + Auto-center active tab
        function renderHorizontalTabs() {
            const bar = document.getElementById('horizontalTabBar');
            if (!bar) return;

            bar.innerHTML = tabsData.map((tab, idx) => {
                const isActive = idx === currentTabIndex;
                return `
                <button id="htab-${idx}" role="tab" aria-selected="${isActive}" onclick="goToTab(${idx})" class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition whitespace-nowrap ${
                    isActive
                        ? 'bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 shadow-md shadow-amber-500/25 ring-1 ring-amber-300'
                        : 'bg-slate-900/90 text-slate-300 hover:text-white hover:bg-slate-800 border border-white/10'
                }">
                    <span class="text-[10px] font-mono px-1.5 py-0.2 rounded ${isActive ? 'bg-slate-950/20 text-slate-950 font-extrabold' : 'bg-slate-800 text-amber-400'}">${idx === 0 ? '★' : idx}</span>
                    <span>${tab.shortTitle}</span>
                </button>`;
            }).join('');

            // Auto-scroll active tab into center view on Samsung Galaxy A02s
            requestAnimationFrame(() => {
                const activeChip = document.getElementById(`htab-${currentTabIndex}`);
                if (activeChip) {
                    activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            });
        }

        function scrollTabBar(offset) {
            const bar = document.getElementById('horizontalTabBar');
            if (bar) {
                bar.scrollBy({ left: offset, behavior: 'smooth' });
            }
        }

        // Render Sandwich Drawer Menu Links
        function renderDrawerLinks() {
            const nav = document.getElementById('drawerLinks');
            nav.innerHTML = tabsData.map((tab, idx) => {
                const isActive = idx === currentTabIndex;
                return `
                <button onclick="goToTab(${idx}); toggleDrawer(false);" class="w-full text-left px-3.5 py-2.5 rounded-xl flex items-center justify-between gap-2 transition ${isActive ? 'bg-amber-500 text-slate-950 font-extrabold shadow-md' : 'bg-slate-900/70 hover:bg-slate-800 text-slate-200 border border-white/5'}">
                    <div class="flex items-center gap-2.5 truncate">
                        <span class="text-[11px] font-mono px-1.5 py-0.5 rounded ${isActive ? 'bg-slate-950/20 text-slate-950' : 'bg-slate-800 text-amber-400'}">${String(idx + 1).padStart(2, '0')}</span>
                        <span class="text-xs sm:text-sm truncate">${tab.shortTitle}</span>
                    </div>
                    ${isActive ? '<span class="text-[10px] uppercase tracking-wider font-extrabold">Actual</span>' : ''}
                </button>`;
            }).join('');
        }

        // Render Current Tab Content & Sequential Footer Buttons
        function renderTab(index) {
            currentTabIndex = index;
            const tab = tabsData[index];
            const total = tabsData.length;

            // Update Header Status
            document.getElementById('topStepBadge').textContent = `PESTAÑA ${index + 1} DE ${total}`;
            document.getElementById('topStepTitle').textContent = tab.shortTitle;
            document.getElementById('bottomCounter').textContent = `${index + 1} / ${total}`;
            document.getElementById('progressBar').style.width = `${((index + 1) / total) * 100}%`;

            // Render Main Section Content (Notice: Only INICIO has "by Rubén Sbarsky" in title)
            const contentEl = document.getElementById('tabContent');
            contentEl.classList.remove('tab-fade');
            void contentEl.offsetWidth; // trigger reflow for animation
            contentEl.classList.add('tab-fade');

            contentEl.innerHTML = `
                <div class="mb-5">
                    <span class="inline-block text-[11px] font-extrabold uppercase tracking-widest text-cyan-400 mb-1">${tab.badge}</span>
                    <h2 class="font-display text-xl sm:text-2xl font-extrabold text-white leading-snug">${tab.title}</h2>
                </div>
                ${tab.content}
            `;

            // Render End-of-Tab Fixed Sequential Navigation Block
            const seqNav = document.getElementById('tabSequentialNav');
            const hasPrev = index > 0;
            const hasNext = index < total - 1;

            seqNav.innerHTML = `
                <div class="agency-card rounded-2xl p-4 space-y-3">
                    <div class="flex items-center justify-between text-[11px] text-slate-400 font-semibold uppercase tracking-wider">
                        <span>Navegación de Pestaña</span>
                        <span>${index + 1} de ${total}</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        ${hasPrev ? `
                            <button onclick="prevTab()" class="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/15 text-left flex items-center gap-3 active:scale-95 transition">
                                <svg class="w-5 h-5 text-amber-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                                </svg>
                                <div class="overflow-hidden">
                                    <span class="text-[10px] uppercase tracking-wider text-slate-400 block">Pestaña Anterior</span>
                                    <span class="text-xs sm:text-sm font-bold text-white truncate block">${tabsData[index - 1].shortTitle}</span>
                                </div>
                            </button>
                        ` : `<div></div>`}

                        ${hasNext ? `
                            <button onclick="nextTab()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 text-right flex items-center justify-between gap-3 font-bold shadow-lg shadow-amber-500/20 active:scale-95 transition ${!hasPrev ? 'sm:col-span-2' : ''}">
                                <div class="overflow-hidden text-left">
                                    <span class="text-[10px] uppercase tracking-wider text-slate-900 font-extrabold block">Próxima Pestaña</span>
                                    <span class="text-xs sm:text-sm font-extrabold text-slate-950 truncate block">${tabsData[index + 1].shortTitle}</span>
                                </div>
                                <svg class="w-5 h-5 text-slate-950 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </button>
                        ` : `
                            <button onclick="goToTab(0)" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-white flex items-center justify-between gap-3 font-bold shadow-lg active:scale-95 transition">
                                <div class="text-left">
                                    <span class="text-[10px] uppercase tracking-wider text-cyan-100 block">Fin del Tutorial</span>
                                    <span class="text-xs sm:text-sm font-extrabold block">Volver a INICIO</span>
                                </div>
                                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                                </svg>
                            </button>
                        `}
                    </div>
                </div>
            `;

            // Update Fixed Footer Buttons State
            document.getElementById('fixedPrevBtn').disabled = !hasPrev;
            document.getElementById('fixedNextBtn').disabled = !hasNext;

            renderHorizontalTabs();
            renderDrawerLinks();
            scrollToTopOfCurrentTab();
        }

        function goToTab(index) {
            if (index >= 0 && index < tabsData.length) {
                renderTab(index);
            }
        }

        function nextTab() {
            if (currentTabIndex < tabsData.length - 1) {
                renderTab(currentTabIndex + 1);
            }
        }

        function prevTab() {
            if (currentTabIndex > 0) {
                renderTab(currentTabIndex - 1);
            }
        }

        function scrollToTopOfCurrentTab() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
        }

        // Toggle Sandwich Menu Drawer
        function toggleDrawer(open) {
            const drawer = document.getElementById('drawerMenu');
            const overlay = document.getElementById('drawerOverlay');
            if (open) {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                drawer.classList.remove('-translate-x-full');
            } else {
                overlay.classList.add('opacity-0');
                drawer.classList.add('-translate-x-full');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // Make Floating Buttons Draggable (Touch + Mouse) while preserving tap action
        function setupDraggableButton(buttonEl, onClickCallback) {
            let isDragging = false;
            let hasMoved = false;
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;

            function pointerDown(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const rect = buttonEl.getBoundingClientRect();

                isDragging = true;
                hasMoved = false;
                startX = clientX;
                startY = clientY;
                initialLeft = rect.left;
                initialTop = rect.top;

                buttonEl.style.right = 'auto';
                buttonEl.style.bottom = 'auto';
                buttonEl.style.left = `${initialLeft}px`;
                buttonEl.style.top = `${initialTop}px`;
            }

            function pointerMove(e) {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
                    hasMoved = true;
                }

                if (hasMoved) {
                    if (e.cancelable) e.preventDefault();
                    const maxX = window.innerWidth - buttonEl.offsetWidth - 6;
                    const maxY = window.innerHeight - buttonEl.offsetHeight - 6;
                    const newLeft = Math.max(6, Math.min(maxX, initialLeft + dx));
                    const newTop = Math.max(6, Math.min(maxY, initialTop + dy));

                    buttonEl.style.left = `${newLeft}px`;
                    buttonEl.style.top = `${newTop}px`;
                }
            }

            function pointerUp() {
                if (!isDragging) return;
                isDragging = false;
                if (!hasMoved) {
                    onClickCallback();
                }
            }

            buttonEl.addEventListener('touchstart', pointerDown, { passive: true });
            window.addEventListener('touchmove', pointerMove, { passive: false });
            window.addEventListener('touchend', pointerUp);

            buttonEl.addEventListener('mousedown', pointerDown);
            window.addEventListener('mousemove', pointerMove);
            window.addEventListener('mouseup', pointerUp);
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderTab(0);

            // Setup draggable INICIO button -> goes to Tab 0 (INICIO)
            setupDraggableButton(document.getElementById('fabInicio'), () => {
                goToTab(0);
            });

            // Setup draggable ARRIBA button -> scrolls to start of current tab
            setupDraggableButton(document.getElementById('fabArriba'), () => {
                scrollToTopOfCurrentTab();
            });
        });
    </script>
</body>
</html>
