/* ===== UTILIDADES ===== */
var $=function(s,e){return (e||document).querySelector(s)};
function tag(t){return '<span class="tag t-'+t+'">'+TAG[t]+'</span>'}
function cards(rows){return '<div class="grid">'+rows.map(function(r){return '<div class="card it">'+tag(r[2])+'<span class="ref">'+(r[3]||'')+'</span><h3>'+r[0]+'</h3><p>'+r[1]+'</p></div>'}).join('')+'</div>'}
var TB=0;
/* Tabla con ordenación por selector y filtro por columna */
function table(cols,rows,filterIdx){
  var id='tb'+(TB++);
  var f='';
  if(filterIdx!=null){
    var vals=[];rows.forEach(function(r){if(vals.indexOf(r[filterIdx])<0)vals.push(r[filterIdx])});
    f='<label>Filtrar: '+cols[filterIdx]+'<select data-f="'+id+'" aria-label="Filtrar por '+cols[filterIdx]+'"><option value="">Todos</option>'+vals.map(function(v){return '<option>'+v+'</option>'}).join('')+'</select></label>';
  }
  var s='<label>Ordenar por<select data-s="'+id+'" aria-label="Ordenar por"><option value="-1">Orden original</option>'+cols.map(function(c,i){return '<option value="'+i+'">'+c+'</option>'}).join('')+'</select></label>';
  return '<div class="bar" id="'+id+'-bar">'+f+s+'</div><table id="'+id+'"><thead><tr>'+cols.map(function(c){return '<th scope="col">'+c+'</th>'}).join('')+'</tr></thead><tbody></tbody></table>'+
  '<script type="application/json" id="'+id+'-d">'+JSON.stringify({c:cols,r:rows,f:filterIdx})+'<\/script>';
}
function fillTable(id){
  var d=JSON.parse($('#'+id+'-d').textContent),fs=$('[data-f="'+id+'"]'),ss=$('[data-s="'+id+'"]');
  var r=d.r.slice();
  if(fs&&fs.value)r=r.filter(function(x){return x[d.f]===fs.value});
  var k=parseInt(ss.value,10);
  if(k>=0)r.sort(function(a,b){return String(a[k]).localeCompare(String(b[k]),'es',{numeric:true})});
  $('#'+id+' tbody').innerHTML=r.length?r.map(function(x){return '<tr class="it">'+x.map(function(c,i){return '<td data-l="'+d.c[i]+'">'+c+'</td>'}).join('')+'</tr>'}).join(''):'<tr><td>Sin resultados para este filtro.</td></tr>';
}

/* Botones fijos al final de cada pestaña: anterior y siguiente */
function pnav(i){
  var h='<div class="pn">';
  if(i>0)h+='<button data-go="'+MODS[i-1].id+'"><small>← Anterior</small>'+MODS[i-1].n+'</button>';
  if(i<MODS.length-1)h+='<button class="nx" data-go="'+MODS[i+1].id+'"><small>Siguiente →</small>'+MODS[i+1].n+'</button>';
  return h+'</div>';
}
/* ===== MONTAJE ===== */
var nav=$('#nav'),pan=$('#panels'),cur='';
MODS.forEach(function(m){
  var b=document.createElement('button');b.textContent=m.n;b.dataset.id=m.id;b.addEventListener('click',function(){go(m.id)});nav.appendChild(b);
  var p=document.createElement('section');p.className='panel';p.id='p-'+m.id;p.setAttribute('aria-label',m.n);p.innerHTML=m.h()+pnav(MODS.indexOf(m));pan.appendChild(p);
  var li=document.createElement('li'),bi=document.createElement('button');bi.dataset.id=m.id;bi.textContent=(MODS.indexOf(m)+1)+'. '+m.n;bi.addEventListener('click',function(){closeDr();go(m.id)});li.appendChild(bi);$('#dl').appendChild(li);
});
/* Las tablas llevan su JSON en un <script>; se rellenan tras insertarlas */
document.querySelectorAll('table[id^=tb]').forEach(function(t){fillTable(t.id)});
document.querySelectorAll('select[data-f],select[data-s]').forEach(function(s){s.addEventListener('change',function(){fillTable(s.dataset.f||s.dataset.s)})});

function go(id,hit){
  if(!$('#p-'+id))id='inicio';
  cur=id;
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id==='p-'+id)});
  document.querySelectorAll('#nav button,#dl button').forEach(function(b){if(b.dataset.id===id){b.setAttribute('aria-current','page');if(b.parentNode===nav&&nav.scrollTo)nav.scrollTo({left:b.offsetLeft-(nav.clientWidth-b.offsetWidth)/2,behavior:'smooth'})}else b.removeAttribute('aria-current')});
  try{history.replaceState(null,'','#'+id)}catch(e){}
  if(hit){hit.classList.add('hit');hit.scrollIntoView({block:'center'});setTimeout(function(){hit.classList.remove('hit')},2200)}else window.scrollTo(0,0);
}

/* Calculadora: solo calcula con datos introducidos */
var inputs=document.querySelectorAll('#calc input');
function calc(){
  var v=[],ok=true;
  inputs.forEach(function(i){var n=parseFloat(i.value);v.push(isNaN(n)?null:n)});
  var precio=v[0],horas=v[6];
  if(precio==null||horas==null||horas<=0){$('#mg').textContent='Sin datos suficientes';$('#bh').textContent='Sin datos suficientes';return}
  var costes=0;v.forEach(function(n,i){if(i!==0&&i!==6&&n!=null)costes+=n});
  var m=precio-costes,f=function(n){return n.toLocaleString('es-ES',{maximumFractionDigits:2})+' €'};
  $('#mg').textContent=f(m);$('#bh').textContent=f(m/horas)+' / h';
}
inputs.forEach(function(i){i.addEventListener('input',calc)});

/* Búsqueda: recorre los elementos .it de todos los módulos */
var res=$('#res');
$('#q').addEventListener('input',function(e){
  var q=e.target.value.trim().toLowerCase();
  if(q.length<2){res.style.display='none';return}
  var out=[];
  document.querySelectorAll('.panel .it').forEach(function(el){
    if(el.textContent.toLowerCase().indexOf(q)>-1){out.push(el)}
  });
  res.style.display='block';
  res.innerHTML=out.length?'':'<p style="margin:8px">Sin resultados.</p>';
  out.slice(0,12).forEach(function(el){
    var pid=el.closest('.panel').id.slice(2),m=MODS.filter(function(x){return x.id===pid})[0];
    var b=document.createElement('button');
    b.innerHTML='<strong>'+m.n+'</strong> · '+el.textContent.replace(/\s+/g,' ').slice(0,100)+'…';
    b.addEventListener('click',function(){res.style.display='none';go(pid,el)});
    res.appendChild(b);
  });
});

/* Botones flotantes movibles (arrastrar con el dedo; un toque ejecuta la acción) */
function fab(el,fn,fromBottom){
  var sx,sy,ox,oy,mv=false,pid=null;
  function place(x,y){x=Math.max(4,Math.min(innerWidth-el.offsetWidth-4,x));y=Math.max(4,Math.min(innerHeight-el.offsetHeight-4,y));el.style.left=x+'px';el.style.top=y+'px'}
  place(innerWidth-el.offsetWidth-12,innerHeight-fromBottom);
  el.addEventListener('pointerdown',function(e){pid=e.pointerId;try{el.setPointerCapture(pid)}catch(x){}sx=e.clientX;sy=e.clientY;var r=el.getBoundingClientRect();ox=r.left;oy=r.top;mv=false});
  el.addEventListener('pointermove',function(e){if(pid!==e.pointerId)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>6||Math.abs(dy)>6)mv=true;if(mv)place(ox+dx,oy+dy)});
  el.addEventListener('pointerup',function(e){if(pid!==e.pointerId)return;pid=null;if(!mv)fn()});
  el.addEventListener('pointercancel',function(){pid=null});
  el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});
  window.addEventListener('resize',function(){var r=el.getBoundingClientRect();place(r.left,r.top)});
}
fab($('#fh'),function(){go('inicio')},170);
fab($('#fu'),function(){window.scrollTo(0,0)},108);
go((location.hash||'#inicio').slice(1));
