<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4a46">
<title>NOVA LLAR · Calculadora de presupuestos</title>
<style>
:root{--ink:#1c2528;--pine:#1f4a46;--birch:#c8a36a;--bg:#f3f4f1;--card:#fff;--line:#d9dcd6;--warn:#a93f23;--mut:#5b676a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pine);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
header b{font-size:18px;letter-spacing:.5px}header small{opacity:.8}
nav{position:sticky;top:0;z-index:5;display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;border:0;background:none;padding:13px 14px;font:inherit;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--pine);border-color:var(--birch);font-weight:600}
main{max-width:980px;margin:0 auto;padding:12px 12px 90px}
section.c{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 12px}
h2{font-size:19px;margin:2px 0 10px}h3{font-size:16px;margin:4px 0 8px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.wide{grid-column:1/-1}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
input,select,textarea{font:inherit;color:var(--ink);padding:9px;border:1px solid #b9bfb8;border-radius:6px;background:#fff;width:100%;min-height:42px}
textarea{min-height:70px}input[type=checkbox],input[type=radio]{width:auto;min-height:0}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
button.b{background:var(--pine);color:#fff;border:0;border-radius:6px;padding:10px 14px;font:inherit;min-height:42px;margin:2px 4px 2px 0}
button.s{background:#fff;color:var(--pine);border:1px solid var(--pine)}button.d{background:var(--warn)}
.ln{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.int{border-left:4px solid var(--birch);padding-left:8px;margin-top:8px}
.tag{font-size:11px;background:var(--birch);color:#2a1f0c;border-radius:4px;padding:2px 6px;margin-left:6px;font-weight:600}
.out{font-size:13px;color:var(--mut);margin-top:6px}summary{cursor:pointer;margin-top:8px;font-size:14px}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}td:first-child,th:first-child{text-align:left}
.wr{background:#fbeae5;border:1px solid #e3b5a6;color:#6b2514;padding:8px 10px;border-radius:6px;margin:6px 0;font-size:14px}
.ok{background:#e5f2ea;border:1px solid #a8d1b7;color:#1b4a2c;padding:8px 10px;border-radius:6px;margin:6px 0;font-size:14px}
.hint{font-size:13px;color:var(--mut)}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;font-size:14px;z-index:6}
.doc{background:#fff;color:#111;padding:18px;border:1px solid var(--line);font:14px/1.45 Georgia,"Times New Roman",serif}
.doc h1{font-size:22px;margin:0}.doc table td,.doc table th{font-size:13px}.doc th{border-bottom:2px solid #111}
.doc .top{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid #1f4a46;padding-bottom:8px;margin-bottom:10px}
.doc .logo{width:120px;height:50px;border:1px dashed #999;color:#999;font-size:11px;display:flex;align-items:center;justify-content:center}
.doc .firma{display:flex;gap:30px;margin-top:30px}.doc .firma div{flex:1;border-top:1px solid #111;padding-top:4px;font-size:12px}
.doc p{margin:4px 0;white-space:pre-wrap}.doc tr{break-inside:avoid}.doc thead{display:table-header-group}
#printRoot{display:none}
@media print{@page{size:A4;margin:16mm}body{background:#fff}.app{display:none!important}#printRoot{display:block}#printRoot .doc{border:0;padding:0}.brk{break-before:page}}
body{-webkit-tap-highlight-color:transparent;overflow-x:hidden}
header{padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(135deg,#1f4a46,#2b5f59)}
header b{font-size:17px}header small{font-size:12px}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{min-height:48px}
section.c{border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(28,37,40,.06)}
h2{color:var(--pine)}
input,select,textarea{font-size:16px;min-height:46px;border-radius:10px;border-color:#c3c9c2}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--birch);outline-offset:1px}
input[type=checkbox]{width:22px;height:22px}.chk{min-height:44px}
button.b{min-height:46px;border-radius:10px;font-weight:600}
.ln{border-radius:12px;background:#fbfbf9}
#bar{padding:8px 14px max(8px,env(safe-area-inset-bottom));gap:10px;flex-wrap:wrap;font-weight:600}
.doc{overflow-x:auto;padding:14px}.doc img.lg{display:block;max-width:120px;max-height:120px;margin-bottom:6px}
.doc table td,.doc table th{overflow-wrap:anywhere}
@media print{.doc{overflow:visible}}
</style></head><body>
